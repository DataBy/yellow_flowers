<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf1f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Florcita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#fdeef2; --sky-bot:#e9f4ff;
  --hill1:#cdebd6; --hill2:#b8e0c6;
  --petal:#ffe98a; --petal-edge:#ffd964; --core:#ffc76b;
  --stem:#9fd8ad; --leaf:#b6e5be;
  --ink:#8a6a5c; --ink-soft:#b39a8f;
  --card:#fff8f6; --shadow-d:rgba(214,180,180,.55); --shadow-l:#ffffff;
  --glow:rgba(255,236,160,.75);
  --stars:0; --sun:1; --moonlight:0;
  --petal-filter:none;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
}
:root[data-theme="night"]{
  --sky-top:#2b2a4d; --sky-bot:#4a4478;
  --hill1:#3e4a72; --hill2:#33406a;
  --petal:#ffe9a3; --petal-edge:#f2cf7a; --core:#f5b96b;
  --stem:#7fb8a0; --leaf:#8cc4ae;
  --ink:#e9e2ff; --ink-soft:#a9a2d0;
  --card:#3a3966; --shadow-d:rgba(20,18,50,.55); --shadow-l:rgba(120,116,190,.28);
  --glow:rgba(190,180,255,.35);
  --stars:1; --sun:0; --moonlight:1;
  --petal-filter:saturate(.85) brightness(.93);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh; overflow:hidden; position:relative;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));
  color:var(--ink);
  transition:background 1.2s ease, color .8s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
}
/* sky */
.sky{position:absolute;inset:0;pointer-events:none}
.sun-glow{position:absolute;top:8%;left:50%;width:120vmin;height:120vmin;transform:translateX(-50%);
  background:radial-gradient(circle,var(--glow) 0%,transparent 60%);transition:background 1.2s}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 1.2s}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8d6;box-shadow:0 0 6px #fff8d6;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
.cloud{position:absolute;height:34px;border-radius:40px;background:#fff;opacity:calc(.85*var(--sun));
  box-shadow:0 8px 20px rgba(200,190,220,.25);transition:opacity 1s;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:38px;height:38px;left:14px;top:-18px}
.cloud::after{width:28px;height:28px;right:16px;top:-12px}
.cloud.a{width:110px;top:16%;left:-140px;animation-duration:70s}
.cloud.b{width:80px;top:28%;left:-140px;animation-duration:95s;animation-delay:-40s}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}

/* particles carried by wind */
.bits{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bit{position:absolute;left:-20px;width:9px;height:12px;border-radius:60% 40% 60% 40%;background:#ffd0dc;opacity:.8;animation:blow linear infinite}
:root[data-theme="night"] .bit{width:6px;height:6px;border-radius:50%;background:#fff3a8;box-shadow:0 0 10px 3px rgba(255,240,150,.7)}
@keyframes blow{
  0%{transform:translate(0,0) rotate(0);opacity:0}
  10%{opacity:.85}
  50%{transform:translate(55vw,-30px) rotate(200deg)}
  100%{transform:translate(115vw,20px) rotate(420deg);opacity:0}
}

/* hills */
.hills{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none}
.hills svg{width:100%;height:100%;display:block}
.hills .h1{fill:var(--hill1);transition:fill 1.2s}
.hills .h2{fill:var(--hill2);transition:fill 1.2s}

/* stage */
main{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
.plant-wrap{width:min(88vw,420px);flex:1;display:flex;align-items:flex-end;min-height:0;cursor:pointer;touch-action:manipulation}
.plant{width:100%;height:auto;max-height:78dvh;overflow:visible;
  transform-origin:50% 96%;animation:sway 6s ease-in-out infinite;
  transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
.plant.gust{animation:gust 2.6s ease-in-out 1}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.6deg)}}
@keyframes gust{0%{transform:rotate(-2deg)}25%{transform:rotate(9deg)}55%{transform:rotate(-4deg)}80%{transform:rotate(2.5deg)}100%{transform:rotate(-2deg)}}
.head{transform-origin:150px 165px;animation:headsway 6s ease-in-out infinite -.8s}
@keyframes headsway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.5deg)}}
.plant.gust .head{animation:headgust 2.6s ease-in-out 1 -.1s}
@keyframes headgust{0%{transform:rotate(-3deg)}25%{transform:rotate(11deg)}55%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
.petals{filter:var(--petal-filter);transition:filter 1.2s}
.petal{transform-origin:150px 165px;animation:flutter 4.2s ease-in-out infinite}
.petal:nth-child(odd){animation-delay:-1.4s}
.petal:nth-child(3n){animation-delay:-2.6s}
@keyframes flutter{0%,100%{transform:rotate(var(--r)) scale(1)}50%{transform:rotate(calc(var(--r) + 2.5deg)) scale(1.035)}}
.leaf-l{transform-origin:150px 380px;animation:leafl 5s ease-in-out infinite -1s}
.leaf-r{transform-origin:150px 340px;animation:leafr 5.6s ease-in-out infinite -2s}
@keyframes leafl{50%{transform:rotate(-7deg)}}
@keyframes leafr{50%{transform:rotate(8deg)}}

/* face */
.eyes-open{transition:opacity .5s}
.eyes-sleep{opacity:0;transition:opacity .5s}
:root[data-theme="night"] .eyes-open{opacity:0}
:root[data-theme="night"] .eyes-sleep{opacity:1}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blush{transition:opacity .4s}
.happy .blush{opacity:1}
.zzz{opacity:0;font-weight:800;fill:var(--ink-soft)}
:root[data-theme="night"] .zzz{opacity:1;animation:zz 4s ease-in-out infinite}
:root[data-theme="night"] .zzz.z2{animation-delay:-2s}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.9}100%{transform:translate(18px,-36px) scale(1.1);opacity:0}}
.mouth-smile{transition:opacity .3s}
.mouth-happy{opacity:0;transition:opacity .3s}
.happy .mouth-happy{opacity:1}
.happy .mouth-smile{opacity:0}
:root[data-theme="night"] .mouth-happy{opacity:0!important}
:root[data-theme="night"] .mouth-smile{opacity:1!important}

/* ui */
.caption{text-align:center;padding:0 24px 6px;min-height:64px}
h1{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:.01em}
.caption p{margin-top:4px;font-size:15px;font-weight:600;color:var(--ink-soft);transition:color .8s}
.moon{
  position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 16px);right:calc(env(safe-area-inset-right) + 18px);
  width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:var(--card);
  box-shadow:8px 8px 18px var(--shadow-d),-6px -6px 14px var(--shadow-l);
  transition:box-shadow .25s,background 1s,transform .25s;
}
.moon:active{box-shadow:inset 5px 5px 10px var(--shadow-d),inset -4px -4px 10px var(--shadow-l);transform:scale(.96)}
.moon:focus-visible{outline:3px solid #ffd964;outline-offset:4px}
.moon svg{width:26px;height:26px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
:root[data-theme="night"] .moon svg{transform:rotate(-25deg)}
.moon .m{fill:#ffd964;stroke:#f5c04a;stroke-width:1.5;transition:opacity .4s}
.moon .s{fill:#ffb4c8;transition:opacity .4s}
:root:not([data-theme="night"]) .moon .s{opacity:0}
:root[data-theme="night"] .moon .m{fill:#fff0a8;stroke:#ffe27a}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .bits,.cloud{display:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun-glow"></div>
  <div class="stars" id="stars"></div>
  <div class="cloud a"></div><div class="cloud b"></div>
</div>
<div class="bits" id="bits" aria-hidden="true"></div>
<div class="hills" aria-hidden="true">
  <svg viewBox="0 0 400 200" preserveAspectRatio="none">
    <path class="h2" d="M0 90 Q90 20 200 70 T400 50 V200 H0Z"/>
    <path class="h1" d="M0 130 Q110 70 220 120 T400 100 V200 H0Z"/>
  </svg>
</div>

<button class="moon" id="toggle" aria-label="Activar modo noche" aria-pressed="false">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path class="m" d="M22 4a13 13 0 1 0 6 20A11 11 0 0 1 22 4z"/>
    <circle class="s" cx="25" cy="8" r="1.6"/><circle class="s" cx="28" cy="14" r="1.1"/>
  </svg>
</button>

<main>
  <div class="plant-wrap" id="wrap" role="img" aria-label="Una flor amarilla sonriente que se mece con el viento. Tócala para que sople una brisa.">
    <svg class="plant" id="plant" viewBox="0 0 300 480">
      <defs>
        <radialGradient id="pg" cx="50%" cy="35%" r="70%">
          <stop offset="0" stop-color="#fff6c0"/><stop offset="1" stop-color="var(--petal-edge)"/>
        </radialGradient>
        <radialGradient id="cg" cx="45%" cy="35%" r="70%">
          <stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="var(--core)"/>
        </radialGradient>
      </defs>
      <ellipse cx="150" cy="468" rx="70" ry="9" fill="#000" opacity=".06"/>
      <!-- stem -->
      <path d="M150 470 C142 400 160 330 150 200" fill="none" stroke="var(--stem)" stroke-width="12" stroke-linecap="round"/>
      <g class="leaf-l"><path d="M148 385 C100 390 70 360 62 330 C105 325 140 345 148 385Z" fill="var(--leaf)"/></g>
      <g class="leaf-r"><path d="M152 345 C200 350 232 322 240 292 C196 288 160 308 152 345Z" fill="var(--leaf)"/></g>
      <!-- head -->
      <g class="head">
        <g class="petals">
          <g class="petal" style="--r:0deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)"/></g>
          <g class="petal" style="--r:45deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(45 150 165)"/></g>
          <g class="petal" style="--r:90deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(90 150 165)"/></g>
          <g class="petal" style="--r:135deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(135 150 165)"/></g>
          <g class="petal" style="--r:180deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(180 150 165)"/></g>
          <g class="petal" style="--r:225deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(225 150 165)"/></g>
          <g class="petal" style="--r:270deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(270 150 165)"/></g>
          <g class="petal" style="--r:315deg"><ellipse cx="150" cy="87" rx="30" ry="42" fill="url(#pg)" transform="rotate(315 150 165)"/></g>
        </g>
        <circle cx="150" cy="165" r="54" fill="url(#cg)"/>
        <circle cx="150" cy="165" r="54" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
        <g id="face">
          <g class="eyes-open">
            <ellipse class="eye" cx="129" cy="160" rx="6.5" ry="8.5" fill="#6b4a3f"/>
            <ellipse class="eye" cx="171" cy="160" rx="6.5" ry="8.5" fill="#6b4a3f"/>
            <circle cx="131.5" cy="156.5" r="2.4" fill="#fff"/><circle cx="173.5" cy="156.5" r="2.4" fill="#fff"/>
          </g>
          <g class="eyes-sleep" fill="none" stroke="#6b4a3f" stroke-width="3.5" stroke-linecap="round">
            <path d="M122 161 q7 7 14 0"/><path d="M164 161 q7 7 14 0"/>
          </g>
          <ellipse class="blush" cx="112" cy="178" rx="9" ry="6" fill="#ff9fb5" opacity=".7"/>
          <ellipse class="blush" cx="188" cy="178" rx="9" ry="6" fill="#ff9fb5" opacity=".7"/>
          <path class="mouth-smile" d="M141 178 q9 8 18 0" fill="none" stroke="#6b4a3f" stroke-width="3.2" stroke-linecap="round"/>
          <path class="mouth-happy" d="M139 176 q11 16 22 0z" fill="#c9605f" stroke="#6b4a3f" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <text class="zzz" x="205" y="118" font-size="22">z</text>
        <text class="zzz z2" x="220" y="100" font-size="16">z</text>
      </g>
    </svg>
  </div>
  <div class="caption">
    <h1 id="title">Florcita</h1>
    <p id="line">Tócala y sopla una brisa</p>
  </div>
</main>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('toggle');
  var meta=document.querySelector('meta[name="theme-color"]');
  var line=document.getElementById('line');
  function get(){try{return localStorage.getItem('florcita-theme')}catch(e){return null}}
  function set(v){try{localStorage.setItem('florcita-theme',v)}catch(e){}}
  function apply(night){
    if(night) root.setAttribute('data-theme','night'); else root.removeAttribute('data-theme');
    btn.setAttribute('aria-pressed',night);
    btn.setAttribute('aria-label',night?'Activar modo día':'Activar modo noche');
    meta.setAttribute('content',night?'#2b2a4d':'#fdf1f3');
    line.textContent=night?'Shh, se quedó dormida':'Tócala y sopla una brisa';
  }
  var saved=get();
  var night=saved?saved==='night':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  apply(night);
  btn.addEventListener('click',function(){night=!night;apply(night);set(night?'night':'day')});

  // stars
  var st=document.getElementById('stars');
  for(var i=0;i<38;i++){var s=document.createElement('i');
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*55+'%';
    s.style.animationDelay=(-Math.random()*4)+'s';
    var z=Math.random()*2+2;s.style.width=s.style.height=z+'px';st.appendChild(s)}

  // wind particles (petals by day, fireflies by night)
  var bits=document.getElementById('bits');
  for(var j=0;j<12;j++){var b=document.createElement('span');b.className='bit';
    b.style.top=(15+Math.random()*60)+'%';
    b.style.animationDuration=(14+Math.random()*14)+'s';
    b.style.animationDelay=(-Math.random()*26)+'s';
    b.style.scale=(.7+Math.random()*.7);
    if(j%3===0)b.style.background='#fff3a8';
    bits.appendChild(b)}

  // tap = gust of wind + happy face
  var wrap=document.getElementById('wrap'),plant=document.getElementById('plant'),face=document.getElementById('face');
  var t;
  wrap.addEventListener('click',function(){
    plant.classList.remove('gust');void plant.getBoundingClientRect();plant.classList.add('gust');
    if(!night)face.classList.add('happy');
    clearTimeout(t);t=setTimeout(function(){plant.classList.remove('gust');face.classList.remove('happy')},2600);
  });
})();
</script>
</body>
</html>
